# cc-e2e-soak — the P6 (f) 24 h soak, as a staging container on the Hetzner box.
#
# Ken's ruling (R-AM): the soak does NOT run on the Windows dev box. It runs
# here, off the prod network, built from the POST-D1-PREP tree. The clock starts
# when Ken runs it; nothing in this file starts a clock by itself.
#
# WHY OFF THE PROD NETWORK, EXPLICITLY
# ------------------------------------
# E2E-PLAN's risk list names "web deploy during soak" as the thing that
# invalidates a soak run, and MA-4/NEW-MA-3 exist because of it: a soak that
# shares a network, a database or a process with prod is a soak whose 24 h
# window any unrelated deploy can silently end. So this stack gets:
#   - its own bridge network, `internal: true` (no egress, no prod reachability)
#   - its own Postgres with its own volume (never the prod DB, never a prod dump)
#   - its own published port, high and explicit, so nothing collides with prod
#   - no Traefik/Coolify labels at all, so the proxy never routes to it
#
# The relay under test is the SAME image content as prod (built from the merged
# tree), because a soak of a different build is evidence about a different
# build. What differs is only its environment.

name: cc-e2e-soak

networks:
  soak:
    driver: bridge
    # No route to the prod network and no inbound from the proxy. The runner and
    # the relay talk to each other over this and nothing else.
    internal: true
  # A second, non-internal network carries ONLY the published port, so the
  # relay stays reachable from the host for Ken's manual checks without giving
  # the database any egress at all.
  soak_edge:
    driver: bridge

volumes:
  soak_pgdata:
  # Trace + heartbeat live on a named volume so a container restart cannot
  # truncate them. RESUME-PROTOCOL rule 8 treats a heartbeat gap > 10 min as an
  # invalidated run, and a bind mount that vanished on restart would manufacture
  # exactly that gap.
  soak_evidence:

services:
  soak-db:
    image: postgres:16-alpine
    container_name: cc-e2e-soak-db
    restart: unless-stopped
    networks: [soak]
    environment:
      POSTGRES_USER: soak
      POSTGRES_PASSWORD: soak
      POSTGRES_DB: ccsoak
    volumes:
      - soak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soak -d ccsoak"]
      interval: 10s
      timeout: 5s
      retries: 12

  soak-relay:
    # Built from the POST-D1-PREP tree. Ken passes the sha so the evidence can
    # name the exact commit the soak ran against — a soak trace that cannot
    # name its build is not evidence.
    build:
      context: ..
      dockerfile: soak/Dockerfile.soak
    image: cc-e2e-soak-relay:${SOAK_SHA:-unset}
    container_name: cc-e2e-soak-relay
    restart: unless-stopped
    depends_on:
      soak-db:
        condition: service_healthy
    networks: [soak, soak_edge]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://soak:soak@soak-db:5432/ccsoak
      # The soak exercises a real encrypted pair, so the kill switch is ON here.
      # This is the one place it is ON before D1 flips it in prod.
      E2E_PAIRING_ENABLED: "1"
      JWT_SECRET: ${SOAK_JWT_SECRET:?SOAK_JWT_SECRET must be set - refusing to boot with a default secret}
      # Security N-2: the whole soak's relay stdout must be greppable as a FILE.
      # `docker logs --since` is explicitly the SECONDARY source because it is
      # subject to the daemon's rotation policy; the file is the primary.
      RELAY_VERBOSE: "1"
    ports:
      # High, explicit, and not a prod port. Only the edge network publishes.
      - "127.0.0.1:39300:3000"
    volumes:
      - soak_evidence:/evidence
    # Capture stdout to the evidence volume for the whole run (N-2), while
    # still letting `docker logs` work.
    command: ["sh", "-c", "node server.js 2>&1 | tee -a /evidence/soak-${SOAK_SHA:-unset}.log"]
    logging:
      driver: json-file
      options:
        # 24 h of a verbose relay comfortably exceeds the 10 MB default, and a
        # rotated-away log is how a canary grep returns 0 for the wrong reason.
        max-size: "200m"
        max-file: "5"

  soak-runner:
    build:
      context: ..
      dockerfile: soak/Dockerfile.soak
    image: cc-e2e-soak-relay:${SOAK_SHA:-unset}
    container_name: cc-e2e-soak-runner
    restart: unless-stopped
    depends_on: [soak-relay]
    networks: [soak]
    environment:
      SOAK_RELAY_WS: ws://soak-relay:3000
      SOAK_EVIDENCE_DIR: /evidence
      SOAK_SHA: ${SOAK_SHA:-unset}
      # 24 h. Set SOAK_HOURS lower ONLY for a rehearsal, and label the evidence
      # as a rehearsal if you do — a 2 h run is not a 24 h run with a shorter
      # clock, and NEW-MA-3 forbids stitching windows into one.
      SOAK_HOURS: ${SOAK_HOURS:-24}
    volumes:
      - soak_evidence:/evidence
    command: ["node", "soak/soak-runner.mjs"]
