<!doctype html>
<!--
  sidepanel.html — the side-panel surface (2026-09-15, forge/ext-badge-sidepanel).

  BYTE-FOR-BYTE popup.html apart from two things: the <body> carries
  data-surface="sidepanel", and there is no fixed pixel box. Same shell.css,
  same shell.js, same signed-out gate, same embedded login. That is the point of
  the dispatch — the panel is not a second implementation of the extension, it
  is the same one in a container Chrome does not destroy on blur.

  Why a separate FILE rather than reusing popup.html: manifest side_panel.
  default_path takes one path, and Chrome resolves it without a query string or
  hash, so the surface cannot identify itself from location. data-surface is how
  shell.js knows which of the three it is running in.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COMPUTER CALLER</title>
  <link rel="stylesheet" href="shell.css" />
  <style>
    /* NO fixed size. A side panel is resized by the user by dragging its edge,
       and Chrome's popup ceiling (600px) does not apply here — the panel is as
       tall as the browser window. Pinning 400 × 600 as popup.html does would
       leave a letterboxed box inside a tall panel. */
    html, body { width: 100%; height: 100%; margin: 0; }
  </style>
</head>
<body data-surface="sidepanel">
  <!-- Signed-out header. Shown ONLY with the overlay; when a session exists
       the iframe owns the entire surface and paints its own header. That is
       the fix for the old glass chip that floated on top of the iframe and
       collided with the app's own header row. -->
  <div id="cc-shell-header">
    <!-- The official lockup (dispatch J, 2026-09-15): the mark with the
         wordmark beneath it, as one SVG. It replaces the mark + a <span> of
         "ComputerCaller" set in the shell's UI face, which was never the
         brand's wordmark. lockup.svg is shipped INSIDE the extension because
         MV3's default img-src 'self' blocks computercaller.com; it carries its
         own prefers-color-scheme block because a background-image SVG is a
         separate document this sheet cannot style. -->
    <span class="cc-lockup" role="img" aria-label="ComputerCaller"></span>
  </div>

  <iframe id="cc-frame" title="ComputerCaller" allow="notifications"></iframe>

  <!-- Signed-out gate (2026-09-15, forge/ext-embedded-login). TWO layers:
       #cc-login-frame is computercaller.com/extension/login embedded right
       here — the real sign-in, no tab, no auth window. #cc-signin-fallback is
       what you see until that frame says `login-ready`, and what you fall back
       to if it never does (CSP refusal, offline, 500): a visible button rather
       than 400px of white. -->
  <div id="cc-signin" role="dialog" aria-labelledby="cc-signin-title" aria-modal="true">
    <iframe id="cc-login-frame" title="Sign in to ComputerCaller"></iframe>
    <!-- Boot skeleton (dispatch PIXEL-D). The FIRST face of the signed-out
         gate, for the ~300-900ms the framed login takes to paint. Without it
         the user sees the fallback's "Sign in" button, reaches for it, and it
         is replaced mid-reach by a form — a button that moves under the cursor
         is worse than a wait. The shapes below mirror the real form's geometry
         so the handover does not jump the layout.
         shell.js retires this after CC_BOOT_MS whether or not the frame
         answered, so a CSP refusal or an offline profile still lands on the
         fallback's real "Try again" button rather than shimmering forever. -->
    <div id="cc-signin-skeleton" aria-hidden="true">
      <div class="cc-sk cc-sk-lockup"></div>
      <div class="cc-sk cc-sk-title"></div>
      <div class="cc-sk cc-sk-google"></div>
      <div class="cc-sk cc-sk-rule"></div>
      <div class="cc-sk cc-sk-label"></div>
      <div class="cc-sk cc-sk-field"></div>
      <div class="cc-sk cc-sk-label cc-sk-label-2"></div>
      <div class="cc-sk cc-sk-field"></div>
      <div class="cc-sk cc-sk-submit"></div>
      <div class="cc-sk cc-sk-links"></div>
    </div>
    <div id="cc-signin-fallback">
      <div class="cc-lockup-hero" role="img" aria-label="ComputerCaller"></div>
      <h1 id="cc-signin-title">Call and text from your browser</h1>
      <p id="cc-signin-body">Sign in and your phone does the calling — you do the typing.</p>
      <button id="cc-signin-btn" type="button">Sign in</button>
      <div id="cc-signin-msg" role="status" aria-live="polite"></div>
      <div class="cc-foot">Calls run on your device · nothing is routed through us</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="shell.js"></script>
</body>
</html>
