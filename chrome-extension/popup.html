<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ComputerCaller</title>
  <link rel="stylesheet" href="shell.css" />
  <style>
    /* 400 × 600 (was 380 × 600), dispatch PIXEL-B2 / AC-1.
       400 is Chrome's own side-panel default width and the extra 20px is
       exactly what the header needed to fit the device pill on one row
       alongside the pop-out and account controls. 600 is Chrome's hard
       popup ceiling — it cannot go taller, so it doesn't try. */
    body { width: 400px; height: 600px; }
  </style>
</head>
<body>
  <!-- Signed-out header. Shown ONLY with the overlay; when a session exists
       the iframe owns the entire surface and paints its own header. That is
       the fix for the old glass chip that floated on top of the iframe and
       collided with the app's own header row. -->
  <div id="cc-shell-header">
    <span class="cc-mark-sm" aria-hidden="true"></span>
    <span class="cc-wordmark">ComputerCaller</span>
  </div>

  <iframe id="cc-frame" title="ComputerCaller" allow="notifications"></iframe>

  <div id="cc-signin" role="dialog" aria-labelledby="cc-signin-title" aria-modal="true">
    <div class="cc-mark"><img src="icon128.png" alt="" /></div>
    <h1 id="cc-signin-title">Call and text from your browser</h1>
    <p id="cc-signin-body">Sign in and your phone does the calling — you do the typing.</p>
    <button id="cc-signin-btn" type="button">Sign in</button>
    <div id="cc-signin-hint">Opens a secure tab · takes 5 seconds</div>
    <div id="cc-signin-msg" role="status" aria-live="polite"></div>
    <div class="cc-foot">Calls run on your device · nothing is routed through us</div>
  </div>

  <script src="config.js"></script>
  <script src="shell.js"></script>
</body>
</html>
