<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ComputerCaller</title>
  <link rel="stylesheet" href="shell.css" />
  <style>
    /* This IS the detached window — it fills whatever Chrome gave it
       (800 × 620, requested in background.js). No fixed pixel size here: the
       user can resize a real window, and the hosted app's layout is written
       to adapt rather than to assume 400px. */
    body { width: 100%; height: 100vh; }
  </style>
</head>
<body data-surface="popout">
  <div id="cc-shell-header">
    <span class="cc-mark-sm" aria-hidden="true"></span>
    <span class="cc-wordmark">ComputerCaller</span>
  </div>

  <iframe id="cc-frame" title="ComputerCaller" allow="notifications"></iframe>

  <!-- Signed-out gate (2026-09-15, forge/ext-embedded-login). TWO layers:
       #cc-login-frame is computercaller.com/extension/login embedded right
       here — the real sign-in, no tab, no auth window. #cc-signin-fallback is
       what you see until that frame says `login-ready`, and what you fall back
       to if it never does (CSP refusal, offline, 500): a visible button rather
       than 400px of white. -->
  <div id="cc-signin" role="dialog" aria-labelledby="cc-signin-title" aria-modal="true">
    <iframe id="cc-login-frame" title="Sign in to ComputerCaller"></iframe>
    <!-- Boot skeleton (dispatch PIXEL-D). The FIRST face of the signed-out
         gate, for the ~300-900ms the framed login takes to paint. Without it
         the user sees the fallback's "Sign in" button, reaches for it, and it
         is replaced mid-reach by a form — a button that moves under the cursor
         is worse than a wait. The shapes below mirror the real form's geometry
         so the handover does not jump the layout.
         shell.js retires this after CC_BOOT_MS whether or not the frame
         answered, so a CSP refusal or an offline profile still lands on the
         fallback's real "Try again" button rather than shimmering forever. -->
    <div id="cc-signin-skeleton" aria-hidden="true">
      <div class="cc-sk cc-sk-title"></div>
      <div class="cc-sk cc-sk-google"></div>
      <div class="cc-sk cc-sk-rule"></div>
      <div class="cc-sk cc-sk-label"></div>
      <div class="cc-sk cc-sk-field"></div>
      <div class="cc-sk cc-sk-label cc-sk-label-2"></div>
      <div class="cc-sk cc-sk-field"></div>
      <div class="cc-sk cc-sk-submit"></div>
      <div class="cc-sk cc-sk-links"></div>
    </div>
    <div id="cc-signin-fallback">
      <div class="cc-mark"><img src="icon128.png" alt="" /></div>
      <h1 id="cc-signin-title">Call and text from your browser</h1>
      <p id="cc-signin-body">Sign in and your phone does the calling — you do the typing.</p>
      <button id="cc-signin-btn" type="button">Sign in</button>
      <div id="cc-signin-msg" role="status" aria-live="polite"></div>
      <div class="cc-foot">Calls run on your device · nothing is routed through us</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="shell.js"></script>
</body>
</html>
