<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ComputerCaller</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { overflow: hidden; background: #0f172a; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    /* No pop-out button here (this IS the popped-out window). */
    #cc-frame { width: 100%; height: 100vh; border: 0; display: block; }
    #cc-signin { display: none; position: absolute; inset: 0; z-index: 10; background: #0f172a; color: #e2e8f0; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; box-sizing: border-box; }
    #cc-signin h1 { font-size: 18px; margin: 0; }
    #cc-signin p { font-size: 13px; color: #94a3b8; margin: 0; }
    #cc-signin-btn { margin-top: 6px; padding: 10px 18px; border: 0; border-radius: 8px; background: #6366f1; color: #fff; font-size: 14px; cursor: pointer; }
    #cc-signin-btn:hover { background: #4f46e5; }
    #cc-signin-msg { font-size: 12px; color: #64748b; min-height: 16px; }
  </style>
</head>
<body>
  <iframe id="cc-frame" allow="notifications"></iframe>
  <div id="cc-signin">
    <h1>ComputerCaller</h1>
    <p>Sign in to control your phone from your browser.</p>
    <button id="cc-signin-btn">Sign in</button>
    <div id="cc-signin-msg"></div>
  </div>
  <script src="config.js"></script>
  <script src="shell.js"></script>
</body>
</html>
