<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DNK Dialer Bridge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 24px;
    }
    .status-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .status-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .status-value {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.connected {
      background: #22c55e;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    input::placeholder {
      color: #666;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    .footer {
      margin-top: auto;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>DNK Dialer Bridge</h1>
  <p class="subtitle">Connect your phone to the web app</p>
  
  <div class="status-card">
    <div class="status-label">Connection Status</div>
    <div class="status-value">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Not connected</span>
    </div>
  </div>
  
  <div class="input-group">
    <label>Phone IP Address</label>
    <input type="text" id="phoneIp" placeholder="192.168.1.100">
  </div>
  
  <button onclick="connect()">Connect to Phone</button>
  
  <p class="footer">Web app server running on port 8766</p>
  
  <script>
    const { ipcRenderer } = require('electron');
    
    function connect() {
      const ip = document.getElementById('phoneIp').value;
      if (ip) {
        ipcRenderer.send('connect-phone', ip);
        document.getElementById('statusText').textContent = 'Connecting...';
      }
    }
    
    ipcRenderer.on('status-update', (event, status) => {
      document.getElementById('statusText').textContent = status;
      const dot = document.getElementById('statusDot');
      if (status.startsWith('Connected')) {
        dot.classList.add('connected');
      } else {
        dot.classList.remove('connected');
      }
    });
    
    // Enter key to connect
    document.getElementById('phoneIp').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') connect();
    });
  </script>
</body>
</html>
